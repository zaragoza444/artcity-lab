name: AC Communications

on:
  push:
    paths:
      - "backend/app/communications/**"
      - "backend/app/api/communications.py"
      - "backend/app/models_comm.py"
      - "backend/tests/test_communications.py"
      - "contracts/ac-communications/**"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/ac-communications/**"

jobs:
  communications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test AC Communications
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          python -m pytest tests/test_communications.py -q
